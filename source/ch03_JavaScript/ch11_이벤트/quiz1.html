<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <style>
    table{width:500px; margin: 10px auto; background-color: darkgreen;}
    td{background-color: white; padding: 50px; text-align: center;}
  </style>
  <script>
    let color = ['yellow', 'red'];
    let tds;
    window.onload = () =>{
        tds = document.getElementsByTagName('td');
    }
    window.onkeyup = () =>{
        let key = event.keyCode;
        //윗숫자 키보드 아스키코드 :48(0)~56(8)
        //옆숫자 키보드 아스키코드 : 96(0)~105(8)
        let index;
        if(48<=key && key<=56){
            index=key-48;
            if(index<tds.length){
                tds[index].style.backgroundColor = color[0];
            }
            
        }else if(96<=key && key<=105){
            index=key-96;
            if(index<tds.length){
                tds[index].style.backgroundColor = color[1];
            }
            
        }
    }
  </script>
</head>
<body>
  <table>
    <tr><td>0</td><td>1</td><td>2</td></tr>
    <tr><td>3</td><td>4</td><td>5</td></tr>
    <tr><td>6</td><td>7</td><td>8</td></tr>
  </table>
</body>
</html>
